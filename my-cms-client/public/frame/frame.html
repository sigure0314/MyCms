<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=no" />
  <title>Wall Frame</title>
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* 兩層交替淡入淡出 */
    .layer {
      position: fixed;
      inset: 0;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 1200ms linear;
      will-change: opacity;
      transform: translateZ(0);
    }
    .layer.show { opacity: 1; }

    /* 縮圖指示器 */
    .mini-map {
      position: fixed;
      left: 16px;
      bottom: 45px; /* 避開下方文字 */
      display: grid;
      gap: 2px;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      width: 60px;
      height: 60px;
      pointer-events: none;
      z-index: 10;
    }
    .mini-map div { background: rgba(255, 255, 255, 0.15); border-radius: 1px; }
    .mini-map div.active { 
      background: #00ff00; 
      box-shadow: 0 0 8px rgba(0, 255, 0, 0.8); 
    }

    /* 訊息提示 */
    #msg {
      position: fixed; left: 16px; bottom: 12px;
      color: rgba(255,255,255,0.6);
      font: 12px/1.2 system-ui, -apple-system, sans-serif;
      white-space: pre;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="a" class="layer show"></div>
  <div id="b" class="layer"></div>
  <div id="mini-map" class="mini-map"></div>
  <div id="msg"></div>

  <script>
    // ====== 參數處理 ======
    const p = new URLSearchParams(location.search);
    const modeParam = (p.get("mode") || "").toLowerCase();
    const hasLayoutOverride = p.has("cols") || p.has("rows") || p.has("mode");
    
    let cols = Math.max(1, Number(p.get("cols") || 3));
    let rows = Math.max(1, Number(p.get("rows") || 1));
    const index = Math.max(0, Number(p.get("index") || 0));
    const ox = Number(p.get("ox") || 0);
    const oy = Number(p.get("oy") || 0);
    const fit = (p.get("fit") || "cover").toLowerCase();
    const PLAYLIST_URL = p.get("playlist") || "/api/frame/playlist";

    // ====== DOM ======
    const layerA = document.getElementById("a");
    const layerB = document.getElementById("b");
    const msg = document.getElementById("msg");
    const mapContainer = document.getElementById("mini-map");

    let col = 0, row = 0, x = 50, y = 50;

    // ====== 佈局與縮圖繪製 ======
    function drawMiniMap() {
      mapContainer.innerHTML = '';
      mapContainer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      mapContainer.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
      
      for (let i = 0; i < cols * rows; i++) {
        const cell = document.createElement('div');
        if (i === index) cell.classList.add('active');
        mapContainer.appendChild(cell);
      }
    }

    function updatePosition() {
      col = index % cols;
      row = Math.floor(index / cols);
      x = (cols === 1) ? 50 : (col / (cols - 1)) * 100;
      y = (rows === 1) ? 50 : (row / (rows - 1)) * 100;
    }

    function applyTransform(layer) {
      layer.style.backgroundSize = `${cols * 100}% ${rows * 100}%`;
      layer.style.backgroundPosition = `${x}% ${y}%`;
      layer.style.backgroundAttachment = "fixed";
      layer.style.transform = `translate(${ox}px, ${oy}px) translateZ(0)`;
    }

    function applyLayout(nextCols, nextRows) {
      cols = Math.max(1, Number(nextCols || cols));
      rows = Math.max(1, Number(nextRows || rows));
      updatePosition();
      applyTransform(layerA);
      applyTransform(layerB);
      drawMiniMap();
      setMsg(`Mode: ${cols}x${rows} | Index: ${index} | Offset: ${ox},${oy}`);
    }

    function resolveLayoutFromMode(mode) {
      const m = (mode || "").toLowerCase();
      if (m === "1x3" || m === "gallery") return { cols: 3, rows: 1 };
      if (m === "3x3" || m === "mall") return { cols: 3, rows: 3 };
      return null;
    }

    // 初始化佈局
    const initialLayout = resolveLayoutFromMode(modeParam);
    if (initialLayout) {
      applyLayout(initialLayout.cols, initialLayout.rows);
    } else {
      applyLayout(cols, rows);
    }

    // ====== 播放與同步邏輯 ======
    let items = [], intervalMs = 15000, transitionMs = 1200;
    let startAtEpochMs = 0, playlistVersion = 1, cacheBustMode = "v";

    function nowMs() { return Date.now(); }
    function setMsg(s) { msg.textContent = s || ""; }

    async function fetchPlaylist() {
      const r = await fetch(PLAYLIST_URL, { cache: "no-store" });
      if (!r.ok) throw new Error("Fetch failed: " + r.status);
      const data = await r.json();

      items = Array.isArray(data.items) ? data.items : [];
      intervalMs = Number(data.intervalMs || intervalMs);
      transitionMs = Number(data.transitionMs || transitionMs);
      
      if (!hasLayoutOverride) {
        const layout = resolveLayoutFromMode(data.layoutMode) || data.layout;
        if (layout) applyLayout(layout.cols, layout.rows);
      }

      startAtEpochMs = Number(data.startAtEpochMs || 0) || nowMs();
      layerA.style.transitionDuration = transitionMs + "ms";
      layerB.style.transitionDuration = transitionMs + "ms";
      return data;
    }

    function preload(url) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.onload = res;
        img.onerror = rej;
        img.src = url;
      });
    }

    let showingA = true, currentIdx = -1;

    async function showIndex(targetIdx) {
      if (!items.length) return;
      const item = items[targetIdx];
      const sep = item.url.includes("?") ? "&" : "?";
      const url = `${item.url}${sep}${cacheBustMode}=${item.version || playlistVersion}`;

      await preload(url);

      const showLayer = showingA ? layerB : layerA;
      const hideLayer = showingA ? layerA : layerB;

      showLayer.style.backgroundImage = `url("${url}")`;
      showLayer.classList.add("show");
      hideLayer.classList.remove("show");

      showingA = !showingA;
      currentIdx = targetIdx;
    }

    async function tick() {
      const ms = nowMs();
      const elapsed = Math.max(0, ms - startAtEpochMs);
      const idx = Math.floor(elapsed / intervalMs) % items.length;

      if (idx !== currentIdx) {
        try { await showIndex(idx); } catch (e) { setMsg("Error loading image\n" + e.message); }
      }

      const nextWait = intervalMs - (elapsed % intervalMs);
      setTimeout(tick, nextWait);
    }

    async function refreshLoop() {
      try {
        const data = await fetchPlaylist();
        if (data.version) playlistVersion = data.version;
        const ms = nowMs();
        await showIndex(Math.floor(Math.max(0, ms - startAtEpochMs) / intervalMs) % items.length);
        setTimeout(tick, intervalMs - (Math.max(0, ms - startAtEpochMs) % intervalMs));
      } catch (e) {
        setMsg("Playlist Error\n" + e.message);
        setTimeout(refreshLoop, 10000);
        return;
      }
      setTimeout(refreshLoop, 60000);
    }

    refreshLoop();
  </script>
</body>
</html>
